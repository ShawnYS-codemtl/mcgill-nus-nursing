title: Students' Society of McGill University (SSMU)
category: Governance
description: Every undergraduate at McGill is a member of the SSMU. We are here to speak out for you and advocate for your interests. On the local university levels, this means being your representation to the McGill administration. We work hard for fairer academic justice processes, better quality instruction, and better services for students. On the broader level, we are also strong advocates for accessible quality public education.
