title: The WELL Office
category: Wellbeing & Safety
description: |-
  The WELL Office provides both Academic Support and Wellness Support to learners from the SPOT, ISoN and SCSD. These services include Counselling Appointments, our Wellness Curriculum and a variety of resources designed specifically for McGill Health Professional Learners.

  If you need a space to discuss your experience, consider signing up to one of their Group Experiential Sessions.
